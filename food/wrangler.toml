name = "mukbang"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = ["/", "/name/*", "/food/*", "/gallery*", "/worldcup*", "/r2/*", "/api/*"]

[[routes]]
pattern = "food.tellmyname.app"
custom_domain = true

[[r2_buckets]]
binding = "MUKBANG_R2"
bucket_name = "myhome-houses-r2"
