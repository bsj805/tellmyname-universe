<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 | 나에게 어울리는 직업 (MyJob)</title>
  <meta name="description" content="나에게 어울리는 직업(job.tellmyname.app) 문의 및 연락처 — 버그 제보, 직업 콘셉트 제안, 광고 및 제휴 문의.">
  <link rel="canonical" href="https://job.tellmyname.app/contact.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/js/consent.js" defer></script>
  <style>
    :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --border-color: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.8; padding: 2rem 1rem; }
    .container { max-width: 860px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 2.5rem 2rem; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 600; }
    h1 { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
    .contact-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 2rem 1.5rem; text-align: center; margin: 2rem 0; }
    .contact-email-link { font-size: 1.5rem; font-weight: 800; color: #fff; }
    footer { border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 3rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    footer a { color: var(--primary); text-decoration: none; margin: 0 0.4rem; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 나에게 어울리는 직업 홈으로</a>
    <h1>문의하기</h1>
    <div class="contact-card">
      <a href="mailto:contact@tellmyname.app?subject=%5BMyJob%5D%20%EB%AC%B8%EC%9D%98" class="contact-email-link">contact@tellmyname.app</a>
      <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.75rem;">영업일 기준 1~3일 이내에 회신드립니다.</p>
    </div>
    <footer>
      <p>&copy; 2026 나에게 어울리는 직업 (job.tellmyname.app). All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
