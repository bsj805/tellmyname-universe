name = "car"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = ["/", "/level/*", "/name/*", "/worldcup*", "/r2/*", "/api/*"]

[[r2_buckets]]
binding = "CAR_R2"
bucket_name = "myhome-houses-r2"
