name = "car"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = true

[[routes]]
pattern = "car.tellmyname.app"
custom_domain = true

[[r2_buckets]]
binding = "CAR_R2"
bucket_name = "myhome-houses-r2"
