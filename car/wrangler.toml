name = "car"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = ["/", "/level/*", "/name/*", "/worldcup*", "/r2/*", "/api/*", "/robots.txt", "/ads.txt"]

[[routes]]
pattern = "car.tellmyname.app"
custom_domain = true

[[r2_buckets]]
binding = "CAR_R2"
bucket_name = "myhome-houses-r2"
