name: Daily 00:00 KST Batch (Messages + Search Queue -> Cloudflare Pages)

on:
  schedule:
    # 매일 한국시간(KST) 자정 00:00 (UTC 15:00) 일일 배치 실행
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  daily-batch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Daily Batch & Build Static HTML (dist/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUEUE_ISSUE_NUMBER: '7'
          SITE_ORIGIN: 'https://tellmyname.app'
        run: |
          node scripts/batch_daily_update.mjs
          node scripts/generate_static_site.mjs

      - name: Commit & Push data/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(batch): daily update messages & search queue"
          git push origin main
