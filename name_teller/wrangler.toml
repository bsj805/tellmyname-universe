name = "name-teller-page"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = true

[[routes]]
pattern = "tellmyname.app"
custom_domain = true

[[routes]]
pattern = "www.tellmyname.app"
custom_domain = true
