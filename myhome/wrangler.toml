name = "myhome"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = ["/", "/level/*", "/name/*", "/worldcup*", "/myhome*", "/food*", "/job*", "/car*", "/r2/*", "/images/*", "/i18n/*", "/src/lib/*", "/api/*"]

[[routes]]
pattern = "tellmyname.app"
custom_domain = true

[[routes]]
pattern = "www.tellmyname.app"
custom_domain = true

[[r2_buckets]]
binding = "MYHOME_R2"
bucket_name = "myhome-houses-r2"

[[services]]
binding = "FOOD_SVC"
service = "mukbang"

[[services]]
binding = "JOB_SVC"
service = "occupation"

[[services]]
binding = "CAR_SVC"
service = "car"
